<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Robot Controller</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3a;
    --accent: #00ff88;
    --accent2: #ff3366;
    --accent3: #3399ff;
    --amber: #ffaa00;
    --text: #e8e8f0;
    --muted: #666680;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 40px; gap: 14px; overflow-x: hidden;
  }

  body::before {
    content: ''; position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  * { position: relative; z-index: 1; }

  header { width: 100%; max-width: 420px; display: flex; align-items: center; justify-content: space-between; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; color: var(--accent); }
  .logo span { color: var(--text); }

  .status-bar {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; display: flex; align-items: center; gap: 12px;
  }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s; }
  .status-dot.connected { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 2s infinite; }
  .status-dot.error { background: var(--accent2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { flex: 1; font-size: 12px; color: var(--muted); letter-spacing: 0.5px; }
  .status-text.connected { color: var(--accent); }
  .status-text.error { color: var(--accent2); }
  .btn-connect {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
    font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 8px 14px; border-radius: 8px; cursor: pointer; transition: background 0.2s, color 0.2s;
    text-transform: uppercase; white-space: nowrap;
  }
  .btn-connect:active { background: var(--accent); color: var(--bg); }
  .btn-connect.connected { border-color: var(--accent2); color: var(--accent2); }
  .btn-connect.connected:active { background: var(--accent2); color: var(--bg); }

  .controls-row { width: 100%; max-width: 420px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ctrl-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1px;
    text-transform: uppercase; padding: 14px 12px; border-radius: 10px; cursor: pointer;
    transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .ctrl-btn:active { transform: scale(0.96); }
  .ctrl-btn.start { border-color: rgba(0,255,136,0.4); color: var(--accent); }
  .ctrl-btn.start:active { background: rgba(0,255,136,0.1); }
  .ctrl-btn.stop-robot { border-color: rgba(255,51,102,0.4); color: var(--accent2); }
  .ctrl-btn.stop-robot:active { background: rgba(255,51,102,0.1); }

  .ligne-btn {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border); color: var(--muted);
    font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; padding: 16px; border-radius: 12px; cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .ligne-btn.active { background: rgba(255,170,0,0.08); border-color: var(--amber); color: var(--amber); box-shadow: 0 0 20px rgba(255,170,0,0.1); }
  .ligne-btn:active { transform: scale(0.98); }
  .ligne-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s; }
  .ligne-btn.active .ligne-indicator { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: pulse 1.5s infinite; }

  .dpad-wrapper {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .dpad-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; align-self: flex-start; }
  .dpad-sublabel { font-size: 10px; color: var(--muted); align-self: flex-start; margin-bottom: 8px; }

  .dpad { display: grid; grid-template-columns: repeat(3, 82px); grid-template-rows: repeat(3, 82px); gap: 6px; }

  .dpad-btn {
    background: #1a1a25; border: 1px solid var(--border); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.1s; user-select: none; -webkit-user-select: none;
  }
  .dpad-btn svg { width: 30px; height: 30px; stroke: var(--muted); transition: stroke 0.1s; }
  .dpad-btn:active, .dpad-btn.pressed { background: rgba(0,255,136,0.12); border-color: var(--accent); transform: scale(0.93); }
  .dpad-btn:active svg, .dpad-btn.pressed svg { stroke: var(--accent); }
  .dpad-btn.stop { background: rgba(255,51,102,0.08); border-color: rgba(255,51,102,0.3); }
  .dpad-btn.stop svg { stroke: var(--accent2); }
  .dpad-btn.stop:active { background: rgba(255,51,102,0.2); border-color: var(--accent2); }
  .dpad-btn.disabled { opacity: 0.2; pointer-events: none; }
  .dpad-empty { background: transparent; border: none; pointer-events: none; }

  .log-box {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; font-size: 11px; color: var(--muted);
    line-height: 1.8; min-height: 56px; max-height: 90px; overflow-y: auto;
  }
  .log-box .entry { display: block; }
  .log-box .entry.ok   { color: var(--accent); }
  .log-box .entry.err  { color: var(--accent2); }
  .log-box .entry.cmd  { color: var(--accent3); }
  .log-box .entry.auto { color: var(--amber); }
</style>
</head>
<body>

<header>
  <div class="logo">ROBOT<span>_CTL</span></div>
  <div style="font-size:10px;color:var(--muted);letter-spacing:1px">S4 · ESIEA</div>
</header>

<div class="status-bar">
  <div class="status-dot" id="dot"></div>
  <div class="status-text" id="statusText">Non connecté — appuie sur CONNECT</div>
  <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">CONNECT</button>
</div>

<div class="controls-row">
  <button class="ctrl-btn start"      onclick="send('%A')">▶ Démarrer</button>
  <button class="ctrl-btn stop-robot" onclick="send('%X')">■ Arrêter</button>
</div>

<button class="ligne-btn" id="ligneBtn" onclick="toggleLigne()">
  <div class="ligne-indicator"></div>
  <span id="ligneBtnText">⬡ Suivi de ligne : OFF</span>
</button>

<div class="dpad-wrapper">
  <div class="dpad-label">Contrôle manuel</div>
  <div class="dpad-sublabel" id="dpadSublabel">Pad actif — mode manuel</div>
  <div class="dpad">
    <div class="dpad-empty"></div>
    <div class="dpad-btn" id="btn-F"
         ontouchstart="pressBtn('F','%F')" ontouchend="releaseBtn('F','%S')"
         onmousedown="pressBtn('F','%F')" onmouseup="releaseBtn('F','%S')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
    </div>
    <div class="dpad-empty"></div>

    <div class="dpad-btn" id="btn-L"
         ontouchstart="pressBtn('L','%L')" ontouchend="releaseBtn('L','%S')"
         onmousedown="pressBtn('L','%L')" onmouseup="releaseBtn('L','%S')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </div>
    <div class="dpad-btn stop" onclick="send('%S')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
    </div>
    <div class="dpad-btn" id="btn-R"
         ontouchstart="pressBtn('R','%R')" ontouchend="releaseBtn('R','%S')"
         onmousedown="pressBtn('R','%R')" onmouseup="releaseBtn('R','%S')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>

    <div class="dpad-empty"></div>
    <div class="dpad-btn" id="btn-B"
         ontouchstart="pressBtn('B','%B')" ontouchend="releaseBtn('B','%S')"
         onmousedown="pressBtn('B','%B')" onmouseup="releaseBtn('B','%S')">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="dpad-empty"></div>
  </div>
</div>

<div class="log-box" id="log">
  <span class="entry">› En attente de connexion...</span>
</div>

<script>
const SERVICE_UUID        = '0000ffe0-0000-1000-8000-00805f9b34fb';
const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

let device = null, characteristic = null, connected = false, modeAuto = false;

function log(msg, type = '') {
  const box = document.getElementById('log');
  const el  = document.createElement('span');
  el.className = 'entry ' + type;
  el.textContent = '› ' + msg;
  box.appendChild(document.createElement('br'));
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

async function toggleConnect() {
  if (connected) { disconnect(); return; }
  try {
    setStatus('Recherche JDY-16...', '');
    log('Scan Bluetooth...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'JDY-16' }],
      optionalServices: [SERVICE_UUID]
    });
    device.addEventListener('gattserverdisconnected', onDisconnected);
    const server  = await device.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
    connected = true;
    setStatus('Connecté à ' + device.name, 'connected');
    document.getElementById('btnConnect').textContent = 'DISCONNECT';
    document.getElementById('btnConnect').classList.add('connected');
    log('Connecté ! Prêt.', 'ok');
  } catch (err) {
    log('Erreur : ' + err.message, 'err');
    setStatus('Erreur de connexion', 'error');
  }
}

function disconnect() {
  if (device && device.gatt.connected) device.gatt.disconnect();
  onDisconnected();
}

function onDisconnected() {
  connected = false; characteristic = null;
  setStatus('Déconnecté', '');
  document.getElementById('btnConnect').textContent = 'CONNECT';
  document.getElementById('btnConnect').classList.remove('connected');
  log('Déconnecté.', 'err');
}

async function send(cmd) {
  if (!connected || !characteristic) { log('Non connecté !', 'err'); return; }
  try {
    await characteristic.writeValue(new TextEncoder().encode(cmd));
    log('→ ' + cmd, 'cmd');
  } catch(err) { log('Erreur : ' + err.message, 'err'); }
}

function pressBtn(id, cmd)    { if (modeAuto) return; document.getElementById('btn-'+id)?.classList.add('pressed');    send(cmd); }
function releaseBtn(id, cmd)  { if (modeAuto) return; document.getElementById('btn-'+id)?.classList.remove('pressed'); send(cmd); }

function toggleLigne() {
  modeAuto = !modeAuto;
  send('%T');
  const btn    = document.getElementById('ligneBtn');
  const txt    = document.getElementById('ligneBtnText');
  const sub    = document.getElementById('dpadSublabel');
  const btns   = document.querySelectorAll('.dpad-btn:not(.stop)');
  if (modeAuto) {
    btn.classList.add('active');
    txt.textContent = '⬡ Suivi de ligne : ON';
    sub.textContent = 'Désactivé — robot en mode autonome';
    btns.forEach(b => b.classList.add('disabled'));
    log('Suivi de ligne ON', 'auto');
  } else {
    btn.classList.remove('active');
    txt.textContent = '⬡ Suivi de ligne : OFF';
    sub.textContent = 'Pad actif — mode manuel';
    btns.forEach(b => b.classList.remove('disabled'));
    log('Mode manuel ON', 'ok');
  }
}

function setStatus(msg, type) {
  document.getElementById('dot').className = 'status-dot ' + type;
  const t = document.getElementById('statusText');
  t.className = 'status-text ' + type; t.textContent = msg;
}

document.querySelectorAll('.dpad-btn').forEach(b => {
  b.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
  b.addEventListener('touchend',   e => e.preventDefault(), { passive: false });
});
</script>
</body>
</html>
